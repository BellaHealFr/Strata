name: Publication

# Une étiquette vX.Y.Z envoyée sur GitHub publie la version : archive prête à
# installer (dossier Strata/ à la racine) et notes tirées de CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publier:
    name: Créer la version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le numéro de version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          core=$(sed -n 's/^ns\.version = "\([^"]*\)".*/\1/p' Core.lua)
          toc=$(sed -n 's/^## Version: *\([^[:space:]]*\).*/\1/p' Strata.toc | tr -d '\r')
          echo "Étiquette : $tag, Core.lua : $core, Strata.toc : $toc"
          [ "$tag" = "$core" ] && [ "$tag" = "$toc" ] || { echo "::error::L'étiquette ne correspond pas aux numéros de version du code"; exit 1; }
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Exiger le rapport de test en jeu
        run: |
          f="docs/tests-en-jeu/$VERSION.md"
          [ -f "$f" ] || { echo "::error::Rapport de test en jeu absent : $f (docs/SUIVI.md, section 7)"; exit 1; }
          if grep -q '^- \[ \]' "$f"; then echo "::error::Cases non cochées dans $f"; exit 1; fi
          grep -qx 'Résultat : validé' "$f" || { echo "::error::$f ne conclut pas par « Résultat : validé »"; exit 1; }

      - name: Extraire les notes de version
        run: |
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::Aucune section « $VERSION » dans CHANGELOG.md"; exit 1; }
          cat >> notes.md <<'EOF'

          ---
          **Installation** : téléchargez l'archive `Strata-*.zip` ci-dessous (pas « Source code »), quittez complètement le jeu, décompressez-la dans `World of Warcraft/Interface/AddOns/`, puis relancez le jeu.

          **Install**: download the `Strata-*.zip` archive below (not "Source code"), quit the game, unzip it into `World of Warcraft/Interface/AddOns/`, then restart the game.
          EOF

      - name: Construire l'archive
        run: git archive --format=zip --prefix=Strata/ -o "Strata-$VERSION.zip" HEAD

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          name: Strata ${{ github.ref_name }}
          body_path: notes.md
          files: Strata-*.zip
